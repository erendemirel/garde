# Single-VPS production stack (Vault server + Agent + Redis + garde API + UI)
#
# Vault runs in production mode (file storage), NOT `vault server -dev`.
# You must initialize and unseal Vault once, then configure AppRole.
#
# First-time bootstrap (see docs/INSTALLATION.md "Deploying to a VPS"):
#   1. Copy dev.secrets → prod.secrets and set production values
#   2. docker compose -f docker-compose.prod.yml up -d vault
#   3. docker compose -f docker-compose.prod.yml exec vault \
#        vault operator init -key-shares=5 -key-threshold=3 -format=json > vault-credentials.json
#      chmod 600 vault-credentials.json   # keep offline / never commit
#      jq -r '.unseal_keys_b64[]' vault-credentials.json > vault-unseal-keys
#      chmod 600 vault-unseal-keys
#   4. Put root_token from that JSON into .env as VAULT_TOKEN=...
#   5. docker compose -f docker-compose.prod.yml --profile ops run --rm vault-unseal
#   6. docker compose -f docker-compose.prod.yml --profile init run --rm vault-init
#   7. docker compose -f docker-compose.prod.yml up -d --build
#
# After every host reboot, Vault seals again — re-run step 5 (vault-unseal) before
# starting vault-agent / garde, or unseal then `up -d`.

services:
  vault:
    image: hashicorp/vault:1.15
    cap_add:
      - IPC_LOCK
    command: server -config=/vault/config/server.hcl
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
    volumes:
      - ./vault/server.hcl:/vault/config/server.hcl:ro
      - vault_data:/vault/data
    # Bind to localhost only — never expose Vault to the public internet
    ports:
      - "127.0.0.1:8200:8200"
    networks:
      - prod_network
    healthcheck:
      # Exit 0 = unsealed; exit 2 = sealed. Fail healthcheck while sealed so
      # dependents wait until the operator has unsealed.
      test: ["CMD", "vault", "status"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  # One-shot: unseal using vault-unseal-keys (one key per line; see INSTALLATION.md)
  vault-unseal:
    image: hashicorp/vault:1.15
    entrypoint: /bin/sh
    command: /vault/unseal-prod.sh
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_UNSEAL_KEYS_FILE: /vault-unseal-keys
    volumes:
      - ./vault/unseal-prod.sh:/vault/unseal-prod.sh:ro
      - ./vault-unseal-keys:/vault-unseal-keys:ro
    depends_on:
      - vault
    networks:
      - prod_network
    profiles:
      - ops

  # One-shot: enable AppRole, write role-id/secret-id, seed secrets from prod.secrets.
  # Requires an unsealed Vault and VAULT_TOKEN (root or equivalent policy token).
  vault-init:
    image: hashicorp/vault:1.15
    entrypoint: /bin/sh
    command: /vault/init-vault-prod.sh
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_TOKEN}
    volumes:
      - ./vault/init-vault-prod.sh:/vault/init-vault-prod.sh:ro
      - ./vault:/vault
      - ./prod.secrets:/prod.secrets:ro
    depends_on:
      vault:
        condition: service_healthy
    networks:
      - prod_network
    profiles:
      - init

  vault-agent:
    image: hashicorp/vault:1.15
    command: vault agent -config=/vault/config/agent.hcl
    environment:
      VAULT_ADDR: http://vault:8200
    volumes:
      - ./vault/agent-config.hcl:/vault/config/agent.hcl:ro
      - ./vault/role-id:/vault/config/role-id:ro
      - ./vault/secret-id:/vault/config/secret-id:ro
      - ./vault/templates:/vault/config/templates:ro
      - prod-secrets:/run/secrets
    depends_on:
      vault:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "test -s /run/secrets/redis_host"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - prod_network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"
    volumes:
      - redis_data_prod:/data
    networks:
      - prod_network
    restart: unless-stopped

  garde:
    build:
      context: .
      dockerfile: Dockerfile
      target: service
    ports:
      - "8443:8443"
    volumes:
      - ./certs:/app/certs:ro
      - ./configs:/app/configs:ro
      - ./data:/app/data
      - prod-secrets:/run/secrets:ro
    depends_on:
      vault-agent:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - prod_network
    restart: unless-stopped

  ui:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8443}
    ports:
      - "80:80"
    depends_on:
      - garde
    networks:
      - prod_network
    restart: unless-stopped

volumes:
  vault_data:
    driver: local
  redis_data_prod:
    driver: local
  prod-secrets:
    driver_opts:
      type: tmpfs
      device: tmpfs
      # Owned by Vault image user (uid 100) so the agent can write; world-readable for garde; not world-writable
      o: size=2m,uid=100,gid=1000,mode=0755

networks:
  prod_network:
    driver: bridge
