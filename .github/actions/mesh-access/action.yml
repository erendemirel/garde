name: Mesh access
description: >-
  Give the runner a path to the hosts. Public SSH is firewalled off on every
  node, so this is the only way in, and it disappears when the job ends.

  Which path depends on the provider. Most declare mesh access, and the runner
  joins the WireGuard mesh as an ephemeral peer. Providers that broker their own
  connection declare tunnel access, and the runner skips WireGuard entirely -
  the hosts have no public address to dial in the first place.

inputs:
  wg-config:
    description: >-
      WireGuard config for the ephemeral CI peer (WG_CI_CONF secret). Not used
      by providers that declare tunnel access.
    required: false
    default: ""
  ssh-key:
    description: Private deploy key (DEPLOY_SSH_KEY secret)
    required: true
  known-hosts:
    description: Pinned host keys (DEPLOY_KNOWN_HOSTS secret)
    required: true
  inventory:
    description: Contents of deploy/inventory.env (DEPLOY_INVENTORY secret)
    required: true
  require-all-nodes:
    description: >-
      Fail the job if any node is unreachable. Deploys want this; failover does
      not, since it usually runs precisely because a node is down.
    required: false
    default: "true"
  gcp-service-account-key:
    description: >-
      Service account JSON, for providers that authenticate from a key file
      rather than environment variables. Written to the runner's temp directory
      and exported as GOOGLE_APPLICATION_CREDENTIALS for the rest of the job.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # Values are passed through env rather than inlined into the script, so no
    # secret is ever expanded into a shell command line.
    - name: Install tooling
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq wireguard-tools zstd rsync jq

    # The inventory names the provider, and the provider decides whether there
    # is a mesh to join, so it has to be on disk before that question is asked.
    - name: Write inventory
      shell: bash
      env:
        INVENTORY: ${{ inputs.inventory }}
      run: |
        set -euo pipefail
        if [ -z "${INVENTORY//[[:space:]]/}" ]; then
          echo "::error::DEPLOY_INVENTORY secret is empty."
          exit 1
        fi
        printf '%s\n' "$INVENTORY" > deploy/inventory.env
        chmod 600 deploy/inventory.env
        chmod +x deploy/scripts/*.sh
        # Fail here with a clear message — load_inventory's : ${NODES:?} is opaque in CI logs.
        missing=""
        for key in NODES SSH_USER REMOTE_ROOT PROVIDER PRIMARY_NODE; do
          if ! grep -qE "^[[:space:]]*${key}=" deploy/inventory.env; then
            missing="$missing $key"
          fi
        done
        if [ -n "$missing" ]; then
          echo "::error::DEPLOY_INVENTORY secrets is missing required keys:$missing"
          echo "--- first 20 non-comment lines of what CI received ---"
          grep -vE '^[[:space:]]*(#|$)' deploy/inventory.env | head -20 || true
          exit 1
        fi
        echo "  inventory: $(grep -E '^[[:space:]]*NODES=' deploy/inventory.env | head -1)"
        echo "  provider:  $(grep -E '^[[:space:]]*PROVIDER=' deploy/inventory.env | head -1)"

    - name: Provide Google Cloud credentials
      if: ${{ inputs.gcp-service-account-key != '' }}
      shell: bash
      env:
        KEY: ${{ inputs.gcp-service-account-key }}
      run: |
        set -euo pipefail
        install -m 600 /dev/null "$RUNNER_TEMP/gcp-key.json"
        printf '%s' "$KEY" > "$RUNNER_TEMP/gcp-key.json"
        echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gcp-key.json" >> "$GITHUB_ENV"

    - name: Resolve access mode
      id: access
      shell: bash
      run: |
        set -euo pipefail
        mode="$(. deploy/scripts/lib.sh && load_inventory \
                 && printf '%s' "${PROVIDER_ADMIN_ACCESS:-mesh}")"
        echo "mode=$mode" >> "$GITHUB_OUTPUT"
        echo "  access mode: $mode"

        # Tunnel providers need cloud credentials on the job env. Scheduled
        # workflows (snapshot) often have no GitHub Environment, so secrets that
        # exist only under "production" appear as empty here — fail loudly.
        . deploy/scripts/lib.sh
        load_inventory
        case "${PROVIDER:-}:$mode" in
          aws:tunnel)
            if [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${AWS_SECRET_ACCESS_KEY:-}" ]; then
              echo "::error::PROVIDER=aws needs AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY on this job."
              echo "::error::If Deploy works but Snapshot does not, those secrets are probably Environment-scoped (production) only."
              echo "::error::Add them as Repository secrets, or duplicate them for every Environment this workflow uses."
              exit 1
            fi
            if [ -z "${AWS_REGION:-${AWS_DEFAULT_REGION:-}}" ]; then
              echo "::error::AWS_REGION is empty. Set repository variable AWS_REGION, or AWS_REGION=… in DEPLOY_INVENTORY."
              exit 1
            fi
            # Ensure later steps see region even when vars.AWS_REGION was unset
            # but inventory supplied it.
            echo "AWS_REGION=${AWS_REGION:-$AWS_DEFAULT_REGION}" >> "$GITHUB_ENV"
            echo "  aws credentials present; region=${AWS_REGION:-$AWS_DEFAULT_REGION}"
            ;;
          gcp:tunnel)
            if [ -z "${GOOGLE_APPLICATION_CREDENTIALS:-}" ] && [ -z "${GOOGLE_CLOUD_PROJECT:-}" ]; then
              echo "::warning::GCP tunnel may need GCP_SERVICE_ACCOUNT_KEY + GOOGLE_CLOUD_PROJECT"
            fi
            ;;
        esac

    # Tunnel providers drive SSH through the cloud CLI (aws open-tunnel / gcloud).
    # ubuntu-latest does not guarantee those tools; install only when needed.
    - name: Install AWS CLI (tunnel)
      if: steps.access.outputs.mode == 'tunnel'
      shell: bash
      run: |
        set -euo pipefail
        if command -v aws >/dev/null 2>&1; then
          aws --version
          exit 0
        fi
        curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
        sudo apt-get install -y -qq unzip
        unzip -q /tmp/awscliv2.zip -d /tmp
        sudo /tmp/aws/install
        aws --version

    - name: Join the mesh
      if: steps.access.outputs.mode == 'mesh'
      shell: bash
      env:
        WG_CONFIG: ${{ inputs.wg-config }}
      run: |
        set -euo pipefail
        if [ -z "$WG_CONFIG" ]; then
          echo "::error::this provider uses mesh access but no wg-config was supplied"
          exit 1
        fi
        printf '%s\n' "$WG_CONFIG" | sudo tee /etc/wireguard/wg0.conf >/dev/null
        sudo chmod 600 /etc/wireguard/wg0.conf
        if ! sudo wg-quick up wg0; then
          echo "::error::could not bring up WireGuard. If the runner image lacks the"
          echo "::error::kernel module, switch this step to a userspace implementation."
          exit 1
        fi
        sudo wg show wg0 | sed 's/^/  /'

    - name: Configure SSH
      shell: bash
      env:
        SSH_KEY: ${{ inputs.ssh-key }}
        KNOWN_HOSTS: ${{ inputs.known-hosts }}
      run: |
        set -euo pipefail
        mkdir -p ~/.ssh && chmod 700 ~/.ssh
        printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519
        printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
        chmod 600 ~/.ssh/known_hosts

        # Operator inventories often pin IdentityFile / UserKnownHostsFile to a
        # workstation path (e.g. /root/.ssh/garde_deploy). That breaks CI: the
        # runner is not root and only has the key we just wrote. Rewrite those
        # options to the CI paths; keep other SSH_OPTS flags intact.
        key="$HOME/.ssh/id_ed25519"
        hosts="$HOME/.ssh/known_hosts"
        if grep -qE '^[[:space:]]*SSH_OPTS=' deploy/inventory.env; then
          # shellcheck disable=SC2016
          awk -v key="$key" -v hosts="$hosts" '
            BEGIN { done=0 }
            /^[[:space:]]*SSH_OPTS=/ {
              line=$0
              # Drop existing -i / IdentityFile / UserKnownHostsFile clauses
              # (quoted or bare), then append CI paths.
              while (match(line, / -i[ =][^" ]+/)) {
                line = substr(line,1,RSTART-1) substr(line,RSTART+RLENGTH)
              }
              while (match(line, / -o IdentityFile=[^" ]+/)) {
                line = substr(line,1,RSTART-1) substr(line,RSTART+RLENGTH)
              }
              while (match(line, / -o UserKnownHostsFile=[^" ]+/)) {
                line = substr(line,1,RSTART-1) substr(line,RSTART+RLENGTH)
              }
              if (line ~ /"$/) {
                sub(/"$/, " -i " key " -o IdentitiesOnly=yes -o UserKnownHostsFile=" hosts "\"", line)
              } else {
                line = line " -i " key " -o IdentitiesOnly=yes -o UserKnownHostsFile=" hosts
              }
              print line
              done=1
              next
            }
            { print }
            END {
              if (!done)
                print "SSH_OPTS=\"-o StrictHostKeyChecking=yes -o ConnectTimeout=10 -i " key " -o IdentitiesOnly=yes -o UserKnownHostsFile=" hosts "\""
            }
          ' deploy/inventory.env > deploy/inventory.env.ci
          mv deploy/inventory.env.ci deploy/inventory.env
          chmod 600 deploy/inventory.env
          echo "  SSH_OPTS rewritten for CI identity at $key"
        else
          printf 'SSH_OPTS="-o StrictHostKeyChecking=yes -o ConnectTimeout=10 -i %s -o IdentitiesOnly=yes -o UserKnownHostsFile=%s"\n' \
            "$key" "$hosts" >> deploy/inventory.env
        fi

    # Uses the deploy scripts' own helpers rather than reimplementing the SSH
    # target, so this checks the same path the rest of the job will use.
    - name: Check reachability
      shell: bash
      env:
        REQUIRE_ALL: ${{ inputs.require-all-nodes }}
      run: |
        set -uo pipefail
        . deploy/scripts/lib.sh
        load_inventory
        unreachable=""
        for node in $NODES; do
          if on_node "$node" true 2>/dev/null; then
            echo "  ok   $node"
          else
            echo "  down $node"
            unreachable="$unreachable $node"
          fi
        done
        if [ -n "${unreachable// /}" ]; then
          echo "unreachable:$unreachable" >> "$GITHUB_STEP_SUMMARY"
          if [ "$REQUIRE_ALL" = "true" ]; then
            echo "::error::unreachable nodes:$unreachable"
            exit 1
          fi
          echo "::warning::continuing with unreachable nodes:$unreachable"
        fi
