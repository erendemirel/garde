name: Infra

# Terraform for DNS A records (and, for AWS, the matching ACME IAM user).
# Compute for AWS also lives under terraform/aws/; netcup servers are ordered
# by hand so terraform/ is DNS-only for that provider.
#
# DNS always follows the hosting provider:
#   netcup → working-directory terraform
#   aws    → working-directory terraform/aws  (set dns_zone in tfvars / TF_VAR)

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/infra.yml"
  workflow_dispatch:
    inputs:
      provider:
        description: Which provider's Terraform root to run
        type: choice
        default: netcup
        options: [netcup, aws]
      action:
        description: What to run
        type: choice
        default: plan
        options: [plan, apply]

concurrency:
  group: terraform-${{ inputs.provider || 'netcup' }}
  cancel-in-progress: false

jobs:
  terraform:
    name: ${{ inputs.provider || 'netcup' }} ${{ inputs.action || 'plan' }}
    runs-on: ubuntu-latest
    # apply requires the production environment; plan does not.
    environment: ${{ inputs.action == 'apply' && 'production' || '' }}
    defaults:
      run:
        working-directory: ${{ (inputs.provider || 'netcup') == 'aws' && 'terraform/aws' || 'terraform' }}
    env:
      TF_IN_AUTOMATION: "true"
      # netcup DNS root
      TF_VAR_netcup_customer_number: ${{ secrets.NETCUP_CUSTOMER_NUMBER }}
      TF_VAR_netcup_api_key: ${{ secrets.NETCUP_API_KEY }}
      TF_VAR_netcup_api_password: ${{ secrets.NETCUP_API_PASSWORD }}
      TF_VAR_netcup_scp_refresh_token: ${{ secrets.NETCUP_SCP_REFRESH_TOKEN }}
      TF_VAR_zone: ${{ vars.DNS_ZONE }}
      TF_VAR_failover_ip: ${{ vars.FAILOVER_IP }}
      # aws root (dns_zone empty = compute-only; set DNS_ZONE to manage Route 53)
      TF_VAR_dns_zone: ${{ vars.DNS_ZONE }}
      TF_VAR_region: ${{ vars.AWS_REGION }}
      TF_VAR_image_bucket_name: ${{ vars.AWS_IMAGE_BUCKET }}
      TF_VAR_ssh_public_key: ${{ secrets.AWS_BOOTSTRAP_SSH_PUBLIC_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init
        run: terraform init -input=false

      - name: Validate
        run: terraform validate

      - name: Plan
        id: plan
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Summarise plan
        run: |
          {
            echo '### Terraform plan'
            echo ''
            echo '```'
            terraform show -no-color tfplan | tail -n 100
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Apply
        if: ${{ inputs.action == 'apply' }}
        run: terraform apply -input=false -auto-approve tfplan
