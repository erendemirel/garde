name: Infra

# Terraform for the AWS garde cluster (compute, IAM, KMS, optional Route 53).
# Working directory: terraform/aws/

on:
  pull_request:
    paths:
      - "terraform/aws/**"
      - ".github/workflows/infra.yml"
  workflow_dispatch:
    inputs:
      action:
        description: What to run
        type: choice
        default: plan
        options: [plan, apply]

concurrency:
  group: terraform-aws
  cancel-in-progress: false

jobs:
  terraform:
    name: aws ${{ inputs.action || 'plan' }}
    runs-on: ubuntu-latest
    # apply requires the production environment; plan does not.
    environment: ${{ inputs.action == 'apply' && 'production' || '' }}
    defaults:
      run:
        working-directory: terraform/aws
    env:
      TF_IN_AUTOMATION: "true"
      TF_VAR_dns_zone: ${{ vars.DNS_ZONE }}
      TF_VAR_region: ${{ vars.AWS_REGION }}
      TF_VAR_image_bucket_name: ${{ vars.AWS_IMAGE_BUCKET }}
      TF_VAR_ssh_public_key: ${{ secrets.AWS_BOOTSTRAP_SSH_PUBLIC_KEY }}
      # Live layout (CIDRs / IPs) comes from garde-live.auto.tfvars in the repo.
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_TF_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_TF_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init
        run: terraform init -input=false

      - name: Validate
        run: terraform validate

      - name: Plan
        id: plan
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Summarise plan
        run: |
          {
            echo '### Terraform plan'
            echo ''
            echo '```'
            terraform show -no-color tfplan | tail -n 100
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Apply
        if: ${{ inputs.action == 'apply' }}
        run: terraform apply -input=false -auto-approve tfplan
