name: Deploy

# The single control point for the cluster. Images are built here and streamed
# to the hosts over SSH, so no registry exists and the hosts hold no pull
# credentials and no source code.
#
# Requires these repository secrets (see docs/DEPLOY.md):
#   DEPLOY_INVENTORY  DEPLOY_SSH_KEY  DEPLOY_KNOWN_HOSTS  WG_CI_CONF
#   REDIS_PASSWORD    GRAFANA_ADMIN_PASSWORD
#   DNS-01 (per PROVIDER): NETCUP_*  or  AWS_ACME_ACCESS_KEY_ID / AWS_ACME_SECRET_ACCESS_KEY
#   Compute (per PROVIDER): AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY, …

on:
  workflow_dispatch:
    inputs:
      stack:
        description: Which stack to deploy
        type: choice
        default: all
        options: [all, app, vault, metrics, monitoring]
      node:
        description: Limit to a single node (blank = all applicable)
        type: string
        default: ""
      dry_run:
        description: Show what would happen without changing anything
        type: boolean
        default: false

concurrency:
  # Never let two deploys, or a deploy and a failover, touch the cluster at once.
  group: cluster-mutation
  cancel-in-progress: false

jobs:
  build:
    name: Build images
    runs-on: ubuntu-latest
    if: ${{ inputs.stack == 'all' || inputs.stack == 'app' }}
    outputs:
      tag: ${{ steps.build.outputs.tag }}
    steps:
      - uses: actions/checkout@v5

      - name: Build
        id: build
        env:
          # The UI bakes the API URL in at build time, so the domain must be
          # known here rather than at deploy time.
          API_DOMAIN: ${{ vars.API_DOMAIN }}
        run: |
          chmod +x deploy/scripts/*.sh
          # A minimal inventory is enough for building; the real one arrives in
          # the deploy job.
          printf 'NODES=none\nSSH_USER=none\nREMOTE_ROOT=/opt/garde\nAPI_DOMAIN=%s\n' "$API_DOMAIN" > deploy/inventory.env
          ./deploy/scripts/build-images.sh --tag "${GITHUB_SHA::12}"

      - name: Export images
        run: |
          mkdir -p /tmp/images
          docker save "garde/api:${GITHUB_SHA::12}"   | zstd -T0 -3 -o /tmp/images/api.tar.zst
          docker save "garde/ui:${GITHUB_SHA::12}"    | zstd -T0 -3 -o /tmp/images/ui.tar.zst
          docker save "garde/caddy:${GITHUB_SHA::12}" | zstd -T0 -3 -o /tmp/images/caddy.tar.zst
          ls -lh /tmp/images

      - uses: actions/upload-artifact@v4
        with:
          name: images-${{ github.sha }}
          path: /tmp/images
          retention-days: 1

  deploy:
    name: Deploy ${{ inputs.stack }}
    runs-on: ubuntu-latest
    needs: [build]
    # Runs even when the build job was skipped for a vault/metrics-only deploy.
    if: ${{ always() && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    environment: production
    # Set on the job because mesh-access needs them too: on providers that
    # tunnel, even checking reachability is an authenticated call.
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      GOOGLE_CLOUD_PROJECT: ${{ vars.GOOGLE_CLOUD_PROJECT }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        if: ${{ needs.build.result == 'success' }}
        with:
          name: images-${{ github.sha }}
          path: /tmp/images

      - name: Load images onto the runner
        if: ${{ needs.build.result == 'success' }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq zstd
          for f in /tmp/images/*.tar.zst; do
            zstd -d -c "$f" | docker load
          done
          docker images "garde/*"

      - uses: ./.github/actions/mesh-access
        with:
          wg-config: ${{ secrets.WG_CI_CONF }}
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          inventory: ${{ secrets.DEPLOY_INVENTORY }}
          gcp-service-account-key: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Deploy
        env:
          IMAGE_TAG: ${{ needs.build.outputs.tag || 'latest' }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          NETCUP_CUSTOMER_NUMBER: ${{ secrets.NETCUP_CUSTOMER_NUMBER }}
          NETCUP_API_KEY: ${{ secrets.NETCUP_API_KEY }}
          NETCUP_API_PASSWORD: ${{ secrets.NETCUP_API_PASSWORD }}
          AWS_ACME_ACCESS_KEY_ID: ${{ secrets.AWS_ACME_ACCESS_KEY_ID }}
          AWS_ACME_SECRET_ACCESS_KEY: ${{ secrets.AWS_ACME_SECRET_ACCESS_KEY }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          ASSUME_YES: "true"
        run: |
          args="${{ inputs.stack }}"
          [ -n "${{ inputs.node }}" ] && args="$args --node ${{ inputs.node }}"
          [ "${{ inputs.dry_run }}" = "true" ] && args="$args --dry-run"
          # shellcheck disable=SC2086
          ./deploy/scripts/deploy.sh $args

      - name: Public health check
        if: ${{ inputs.dry_run != true }}
        run: ./deploy/scripts/healthcheck.sh --all --public

      - name: Leave the mesh
        if: always()
        run: sudo wg-quick down wg0 || true
