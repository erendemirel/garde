name: Snapshot and verify

# Secondary safety net for permissions.db — not the primary scheduler.
#
# Primary path (provider / host native): garde-snapshot.timer on each app node
# runs /opt/garde/scripts/snapshot.sh every SQLITE_SNAPSHOT_INTERVAL (default
# 5min). Only the Redis master actually snapshots; copies travel peer-to-peer
# over the mesh. That does not depend on GitHub cron.
#
# This workflow is a fallback: force a snapshot + health check on a slower
# cadence, or on demand. GitHub schedule is best-effort and can lag for hours.

on:
  schedule:
    # Secondary only — host timer owns RPO. Six hours is enough as a net.
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    name: Snapshot permissions.db
    runs-on: ubuntu-latest
    # No `environment:` on purpose — required reviewers would block the schedule.
    # Tunnel credentials must therefore be Repository secrets/vars, not only
    # Environment secrets under `production` (Deploy can see those; this job cannot).
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      GOOGLE_CLOUD_PROJECT: ${{ vars.GOOGLE_CLOUD_PROJECT }}
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/mesh-access
        with:
          wg-config: ${{ secrets.WG_CI_CONF }}
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          inventory: ${{ secrets.DEPLOY_INVENTORY }}
          gcp-service-account-key: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
          require-all-nodes: "false"

      - name: Snapshot
        run: ./deploy/scripts/sqlite-snapshot.sh

      - name: Health check
        run: ./deploy/scripts/healthcheck.sh --all

      - name: Leave the mesh
        if: always()
        run: sudo wg-quick down wg0 || true
