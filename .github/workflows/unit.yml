name: Unit

on:
  pull_request:
  push:
    branches: [master, main]

concurrency:
  group: unit-${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: garde
          POSTGRES_PASSWORD: garde
          POSTGRES_DB: garde
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U garde -d garde"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...
        env:
          CGO_ENABLED: "0"

      - name: Test
        # Serialise packages that share GARDE_TEST_DATABASE_URL (TRUNCATE races).
        run: go test -p 1 ./...
        env:
          CGO_ENABLED: "0"
          GARDE_TEST_DATABASE_URL: postgres://garde:garde@localhost:5432/garde?sslmode=disable
