# Vault Raft member. Deployed to all three nodes.
#
# Storage is Integrated Storage (Raft), so the three members replicate to each
# other and elect a leader. Losing one host leaves a 2/3 quorum and the cluster
# keeps serving.
#
# There is no auto-unseal (no cloud KMS), so a restarted member must be
# unsealed by an operator with deploy/scripts/unseal.sh. The other two members
# keep serving while that happens.
#
# The API and cluster ports are published on the WireGuard address only.

services:
  vault:
    image: hashicorp/vault:1.15
    container_name: garde-vault
    cap_add:
      - IPC_LOCK
    # Just `server`, with no -config. The image's entrypoint expands a bare
    # `server` into `vault server -config=/vault/config ...`, which loads every
    # file in that directory - including the raft.hcl mounted below. Passing
    # -config as well loads it a second time, and because listeners merge as a
    # list rather than overriding, Vault then tries to bind 8200 twice and dies
    # with "address already in use".
    command: server
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
      # Deliberately no SKIP_CHOWN: it gates the ownership fixup below.
    volumes:
      - ../config/vault/raft.hcl:/vault/config/raft.hcl:ro
      # Raft data goes in /vault/file, not the more obvious /vault/data.
      #
      # The image creates /vault/config, /vault/logs and /vault/file owned by
      # the vault user, and its entrypoint chowns exactly those three before
      # dropping to that user. A named volume inherits ownership from the image
      # directory it covers, so a volume mounted here arrives owned by vault.
      # Mount it at /vault/data instead - a path the image never creates and the
      # entrypoint never chowns - and Docker makes it root-owned, leaving the
      # member in a restart loop on "failed to open bolt file: permission
      # denied". The path in config/vault/raft.hcl.tpl must agree with this.
      - vault_raft:/vault/file
    ports:
      - "${NODE_WG_IP:?NODE_WG_IP is required}:8200:8200"
      - "${NODE_WG_IP}:8201:8201"
    healthcheck:
      # exit 0 = unsealed and active/standby, exit 2 = sealed.
      # Sealed intentionally fails so dependents wait for an operator.
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped
    networks:
      - vault_net

volumes:
  vault_raft:
    driver: local

networks:
  vault_net:
    name: garde_vault_net
    driver: bridge
