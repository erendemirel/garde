services:

  # DEV: Vault Server (dev mode)
  dev-vault:
    image: hashicorp/vault:1.15
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: devtoken
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "8200:8200"
    networks:
      - vault_network
    healthcheck:
      test: ["CMD", "sh", "-c", "VAULT_ADDR=http://127.0.0.1:8200 vault status"]
      interval: 5s
      timeout: 3s
      retries: 10
    profiles:
      - dev

  # DEV: Vault Init (seeds secrets from dev.secrets; writes agent token)
  dev-vault-init:
    image: hashicorp/vault:1.15
    entrypoint: /bin/sh
    command: /vault/init-vault.sh
    environment:
      VAULT_ADDR: http://dev-vault:8200
      VAULT_TOKEN: devtoken
      VAULT_AGENT_TOKEN_DIR: /vault/agent-token
    volumes:
      - ./vault/init-vault.sh:/vault/init-vault.sh:ro
      - ./dev.secrets:/dev.secrets:ro
      - vault-agent-token:/vault/agent-token
    depends_on:
      dev-vault:
        condition: service_healthy
    networks:
      - vault_network
    profiles:
      - dev

  # DEV: Vault Agent (writes secrets to tmpfs)
  dev-vault-agent:
    image: hashicorp/vault:1.15
    command: vault agent -config=/vault/config/agent.hcl
    environment:
      VAULT_ADDR: http://dev-vault:8200
    volumes:
      - ./vault/agent-config-dev.hcl:/vault/config/agent.hcl:ro
      - vault-agent-token:/vault/config/token:ro
      - vault-secrets:/run/secrets
    depends_on:
      dev-vault-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "sh", "-c", "test -s /run/secrets/redis_host"]
      interval: 2s
      timeout: 2s
      retries: 30
    networks:
      - vault_network
    profiles:
      - dev

  # DEV: Redis
  dev-redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --requirepass "redis"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - redis_network
    profiles:
      - dev

  # DEV: Auth Service (with bundled Vault + Redis)
  dev-garde:
    build:
      context: .
      dockerfile: Dockerfile
      target: service
    ports:
      - "8443:8443"
    volumes:
      - ./certs:/app/certs:ro
      - ./configs:/app/configs:ro
      - ./data:/app/data
      - vault-secrets:/run/secrets:ro
    environment:
      DOCKER_PROFILE: with-redis
    depends_on:
      dev-vault-agent:
        condition: service_healthy
      dev-redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8443/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - auth_network
      - redis_network
      - vault_network
    profiles:
      - dev

volumes:
  redis_data:
    driver: local
  vault-agent-token:
    driver: local
  vault-secrets:
    driver_opts:
      type: tmpfs
      device: tmpfs
      # Owned by Vault image user (uid 100) so the agent can write; world-readable for garde; not world-writable
      o: size=1m,uid=100,gid=1000,mode=0755

networks:
  auth_network:
    name: garde_network
    driver: bridge
  redis_network:
    name: redis_service_network
    driver: bridge
  vault_network:
    name: vault_network
    driver: bridge
