services:

  # DEV: Vault Server (dev mode)
  dev-vault:
    image: hashicorp/vault:1.15
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: devtoken
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "8200:8200"
    networks:
      - vault_network
    healthcheck:
      test: ["CMD", "sh", "-c", "VAULT_ADDR=http://127.0.0.1:8200 vault status"]
      interval: 5s
      timeout: 3s
      retries: 10
    profiles:
      - dev

  # DEV: Vault Init (seeds secrets from dev.secrets; writes agent token)
  dev-vault-init:
    image: hashicorp/vault:1.15
    entrypoint: /bin/sh
    command: /vault/init-vault.sh
    environment:
      VAULT_ADDR: http://dev-vault:8200
      VAULT_TOKEN: devtoken
      VAULT_AGENT_TOKEN_DIR: /vault/agent-token
    volumes:
      - ./vault/init-vault.sh:/vault/init-vault.sh:ro
      - ./dev.secrets:/dev.secrets:ro
      - vault-agent-token:/vault/agent-token
    depends_on:
      dev-vault:
        condition: service_healthy
    networks:
      - vault_network
    profiles:
      - dev

  # DEV: Vault Agent (writes secrets to tmpfs)
  # Root uid keeps host-mounted AppRole files (mode 600) readable; primary
  # gid 1000 so rendered secrets are group-owned and garde can read 0640 files.
  dev-vault-agent:
    image: hashicorp/vault:1.15
    user: "0:1000"
    command: vault agent -config=/vault/config/agent.hcl
    environment:
      VAULT_ADDR: http://dev-vault:8200
    volumes:
      - ./vault/agent-config-dev.hcl:/vault/config/agent.hcl:ro
      - vault-agent-token:/vault/config/token:ro
      - vault-secrets:/run/secrets
    depends_on:
      dev-vault-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "sh", "-c", "test -s /run/secrets/redis_host && (test -s /run/secrets/database_url || test -s /run/secrets/postgres_host)"]
      interval: 2s
      timeout: 2s
      retries: 30
    networks:
      - vault_network
    profiles:
      - dev

  # DEV: PostgreSQL (durable authority)
  dev-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: garde
      POSTGRES_PASSWORD: garde
      POSTGRES_DB: garde
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U garde -d garde"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - postgres_network
    profiles:
      - dev

  # DEV: Redis (ephemeral: sessions, rate limits, OTPs)
  dev-redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --requirepass "redis"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - redis_network
    profiles:
      - dev

  # DEV: Auth Service
  # group 1000 matches secrets tmpfs / vault-agent so 0640 secret files are readable
  # without world-readable mount mode.
  dev-garde:
    build:
      context: .
      dockerfile: Dockerfile
      target: service
    group_add:
      - "1000"
    ports:
      - "8443:8443"
    volumes:
      - ./certs:/app/certs:ro
      - ./configs:/app/configs:ro
      - vault-secrets:/run/secrets:ro
    environment:
      DOCKER_PROFILE: with-redis
    depends_on:
      dev-vault-agent:
        condition: service_healthy
      dev-postgres:
        condition: service_healthy
      dev-redis:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null --no-check-certificate https://127.0.0.1:8443/ready || wget -q -O /dev/null http://127.0.0.1:8443/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - auth_network
      - redis_network
      - postgres_network
      - vault_network
    profiles:
      - dev

  # DEV: Cap Standalone (optional PoW captcha + dashboard). Enforcement is off
  # until CAP_ENABLED=true and site/secret keys are set in Vault /dev.secrets.
  # Dashboard: http://localhost:3000 (ADMIN_KEY from CAP_ADMIN_KEY).
  cap:
    image: tiago2/cap:3.1.11
    ports:
      - "3000:3000"
    environment:
      ADMIN_KEY: ${CAP_ADMIN_KEY:-dev-cap-admin-key-change-me-please-32c}
      REDIS_URL: redis://:redis@dev-redis:6379
      REDIS_PREFIX: "cap:"
      CORS_ORIGIN: http://localhost:5173,http://localhost:3000
      ENABLE_ASSETS_SERVER: "true"
      WIDGET_VERSION: "0.1.57"
    depends_on:
      dev-redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - redis_network
      - auth_network
    profiles:
      - dev

volumes:
  redis_data:
    driver: local
  postgres_data:
    driver: local
  vault-agent-token:
    driver: local
  vault-secrets:
    driver_opts:
      type: tmpfs
      device: tmpfs
      # uid 100 / gid 1000: agent writes as 0:1000; garde joins group 1000 (no world-read).
      o: size=1m,uid=100,gid=1000,mode=0750

networks:
  auth_network:
    name: garde_network
    driver: bridge
  redis_network:
    name: redis_service_network
    driver: bridge
  postgres_network:
    name: postgres_service_network
    driver: bridge
  vault_network:
    name: vault_network
    driver: bridge
