# Host baseline for the garde cluster.
#
#   First run, before the mesh exists:
#     ansible-playbook playbooks/bootstrap.yml -e use_mesh=false \
#       -e deploy_pubkey_file=~/.ssh/garde_deploy.pub
#
#   Afterwards, over the WireGuard mesh (your workstation must be the ops peer):
#     ansible-playbook playbooks/bootstrap.yml
#
#   Where the provider brokers access instead of the mesh (AWS, GCP), the
#   tunnel is the only route in and use_mesh does not apply, so both runs are
#   the same command. The private key for the account BOOTSTRAP_SSH_USER names
#   has to be findable: --private-key=~/.ssh/whatever.pem, or an agent.
#
#   See what has drifted without changing anything:
#     ansible-playbook playbooks/bootstrap.yml --check --diff
#
#   One host only:
#     ansible-playbook playbooks/bootstrap.yml --limit node2
#
# Connects as BOOTSTRAP_SSH_USER - root where the provider allows it, and the
# image's default sudo account (ubuntu, ec2-user, debian) where it does not.
# The deploy user this creates deliberately has no sudo: it only needs the
# docker socket, and CI only ever uses that account. Privileged host changes go
# through this playbook instead.

- name: Load the deployment inventory
  hosts: localhost
  gather_facts: false
  vars:
    # Set to false for the very first run, when the mesh is not up yet and the
    # firewall has not closed public SSH.
    use_mesh: true
  tasks:
    - name: Read deploy/inventory.env
      ansible.builtin.command: bash {{ playbook_dir }}/../inventory-to-json.sh
      register: inventory_json
      changed_when: false
      # Reads a local file and changes nothing, but command tasks are skipped
      # under --check by default. Skipping it leaves the next task parsing an
      # empty string, so --check could never get as far as the hosts.
      check_mode: false

    - name: Parse it
      ansible.builtin.set_fact:
        garde: "{{ inventory_json.stdout | from_json }}"

    - name: Fail early if roles are missing
      ansible.builtin.assert:
        that:
          - garde.nodes | selectattr('role', 'equalto', 'app-primary') | list | length == 1
          - garde.nodes | selectattr('role', 'equalto', 'app-standby') | list | length == 1
          - garde.nodes | selectattr('role', 'equalto', 'witness') | list | length >= 1
        fail_msg: >-
          deploy/inventory.env must define exactly one app-primary, one
          app-standby and at least one witness. After a failover, swap the
          NODE*_ROLE values before running this playbook.

    - name: Register the nodes
      ansible.builtin.add_host:
        name: "{{ item.name }}"
        groups:
          - garde_nodes
          - "role_{{ item.role | replace('-', '_') }}"
        # Three cases. Where the provider brokers access the hosts have no
        # public address at all, so the tunnel is the only route and use_mesh
        # does not apply. Otherwise it is the mesh address, or - on a first run,
        # before the mesh exists - the public one.
        ansible_host: >-
          {{ item.admin_host if garde.admin_access == 'tunnel'
             else (item.wg_ip if (use_mesh | bool) else item.public_ip) }}
        # HostKeyAlias travels with the ProxyCommand. Without it the host key
        # is pinned to the provider's id for the machine, which the shell
        # tooling never uses and which changes whenever an instance is
        # replaced - so Ansible would reject a host the deploy scripts trust.
        ansible_ssh_common_args: >-
          {{ '-o ProxyCommand="' ~ item.admin_proxy_command ~ '"'
             ~ ' -o HostKeyAlias=' ~ item.admin_alias
             if garde.admin_access == 'tunnel' else '' }}
        ansible_user: "{{ garde.bootstrap_user }}"
        ansible_port: "{{ garde.ssh_port }}"
        node_name: "{{ item.name }}"
        node_role: "{{ item.role }}"
        node_wg_ip: "{{ item.wg_ip }}"
        node_public_ip: "{{ item.public_ip }}"
        node_vault_id: "{{ item.vault_id }}"
        node_provider_id: "{{ item.provider_id }}"
        garde_facts: "{{ garde }}"
      loop: "{{ garde.nodes }}"
      loop_control:
        label: "{{ item.name }} ({{ item.role }})"
      changed_when: false

- name: Baseline
  hosts: garde_nodes
  gather_facts: true
  # Every role here changes privileged host state. Connecting as root needs no
  # escalation; connecting as a cloud image's default account does. Escalating
  # unconditionally would instead require sudo to exist on images where root
  # logs in directly, which is not a safe assumption either.
  become: "{{ garde_facts.bootstrap_user != 'root' }}"
  vars:
    deploy_user: "{{ garde_facts.ssh_user }}"
    remote_root: "{{ garde_facts.remote_root }}"
    wg_subnet: "{{ garde_facts.wg_subnet }}"
    wg_port: "{{ garde_facts.wg_port }}"
  roles:
    - common
    - docker
    - deploy_user
    # WireGuard comes before the firewall on purpose. The firewall restricts
    # SSH to the mesh, so the mesh has to exist first, and on a first run the
    # current connection survives only because ufw keeps established sessions.
    - wireguard
    - firewall
    # Skipped entirely on providers that deliver the address rather than route
    # it. The capability comes from the driver, so there is no provider name
    # anywhere in the Ansible layer.
    - role: failover_ip
      when:
        - node_role in ['app-primary', 'app-standby']
        - garde_facts.requires_ip_binding | bool

- name: Snapshot timer
  hosts: role_app_primary:role_app_standby:role_witness
  gather_facts: false
  become: "{{ garde_facts.bootstrap_user != 'root' }}"
  vars:
    deploy_user: "{{ garde_facts.ssh_user }}"
    remote_root: "{{ garde_facts.remote_root }}"
  roles:
    - snapshot
