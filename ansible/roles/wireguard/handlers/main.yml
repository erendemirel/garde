# Restarting the interface cuts the very connection Ansible is using once the
# control machine talks to the host over the mesh. Firing it asynchronously and
# then waiting for the host to come back is what keeps that from failing the
# play halfway through.
- name: Restart wireguard
  ansible.builtin.command: systemctl restart wg-quick@wg0
  async: 30
  poll: 0
  changed_when: true
  listen: Restart wireguard

- name: Wait for the mesh to come back
  ansible.builtin.wait_for_connection:
    delay: 5
    timeout: 90
  listen: Restart wireguard
