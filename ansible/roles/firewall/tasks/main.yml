# Public exposure is WireGuard everywhere, plus HTTP/HTTPS on the two app
# nodes. Everything else - SSH, Vault, Redis, the exporters - is reachable only
# from inside the mesh.
#
# Note the ordering constraint from the playbook: WireGuard is configured
# first, because these rules restrict SSH to the mesh subnet.

- name: Default deny inbound
  community.general.ufw:
    direction: incoming
    policy: deny

- name: Default allow outbound
  community.general.ufw:
    direction: outgoing
    policy: allow

- name: Allow WireGuard
  community.general.ufw:
    rule: allow
    port: "{{ wg_port }}"
    proto: udp
    comment: wireguard

- name: Allow SSH from the mesh only
  community.general.ufw:
    rule: allow
    src: "{{ wg_subnet }}"
    port: "22"
    proto: tcp
    comment: ssh over mesh

# Where the provider brokers the connection, SSH arrives from the tunnel's own
# range rather than from the mesh, and the rule above would lock it out. This is
# still not public exposure: the range belongs to the provider's proxy or to
# your own VPC, and every connection through it is authorised by the provider's
# IAM before it reaches the host.
- name: Allow SSH from the provider tunnel
  community.general.ufw:
    rule: allow
    src: "{{ item }}"
    port: "22"
    proto: tcp
    comment: ssh over provider tunnel
  loop: "{{ garde_facts.admin_ssh_sources | default('') | split() }}"
  when: garde_facts.admin_ssh_sources | default('') | length > 0

- name: Allow HTTP and HTTPS on the app nodes
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
    comment: public edge
  loop: ["80", "443"]
  when:
    - node_role in ['app-primary', 'app-standby']
    - garde_facts.edge_sources | default('') | length == 0

# In the managed-load-balancer lane the edge is the platform's load balancer,
# not the internet. It forwards plain HTTP inside the VPC, so only :80 is
# opened and only to the ranges the balancer speaks from. Nothing answers 443
# on the host at all: compose binds it to loopback there.
- name: Allow HTTP from the load balancer only
  community.general.ufw:
    rule: allow
    src: "{{ item }}"
    port: "80"
    proto: tcp
    comment: load balancer edge
  loop: "{{ garde_facts.edge_sources | default('') | split() }}"
  when:
    - node_role in ['app-primary', 'app-standby']
    - garde_facts.edge_sources | default('') | length > 0

- name: Deny public HTTPS where the load balancer terminates TLS
  community.general.ufw:
    rule: deny
    port: "443"
    proto: tcp
    delete: true
  when:
    - node_role in ['app-primary', 'app-standby']
    - garde_facts.edge_sources | default('') | length > 0
  failed_when: false

- name: Deny HTTP and HTTPS elsewhere
  # The witness has no edge role; keeping this explicit means a node that
  # changes role does not silently keep an open port.
  community.general.ufw:
    rule: deny
    port: "{{ item }}"
    proto: tcp
    delete: true
  loop: ["80", "443"]
  when: node_role not in ['app-primary', 'app-standby']
  failed_when: false

- name: Allow internal services from the mesh only
  community.general.ufw:
    rule: allow
    src: "{{ wg_subnet }}"
    port: "{{ item.port }}"
    proto: tcp
    comment: "{{ item.comment }}"
  loop:
    - { port: "8200", comment: "vault api" }
    - { port: "8201", comment: "vault raft cluster" }
    - { port: "6379", comment: "redis replication" }
    # garde's service listener: /validate over mTLS, for calling services that
    # are on the mesh. Never reachable from the edge.
    - { port: "{{ garde_facts.service_port | default('8444') }}", comment: "garde service listener" }
    - { port: "9100", comment: "node exporter" }
    - { port: "8080", comment: "cadvisor" }
    - { port: "9090", comment: "prometheus" }
    - { port: "3000", comment: "grafana" }
  loop_control:
    label: "{{ item.port }} {{ item.comment }}"

- name: Enable ufw
  community.general.ufw:
    state: enabled

- name: Record the resulting ruleset
  ansible.builtin.command: ufw status verbose
  register: ufw_status
  changed_when: false

- name: Show the ruleset
  ansible.builtin.debug:
    var: ufw_status.stdout_lines
