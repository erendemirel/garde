# Ansible owns the host baseline only: packages, users, Docker, WireGuard,
# firewall and the snapshot timer. Deploys, Vault ceremonies and failover stay
# in deploy/scripts/ because they are sequenced and decision-heavy rather than
# convergent.
#
# Run from this directory:  cd ansible && ansible-playbook playbooks/bootstrap.yml

[defaults]
# Hosts are added dynamically from deploy/inventory.env, so the static
# inventory only needs localhost to run that first play against.
inventory            = inventory/local.yml
roles_path           = roles
host_key_checking    = True
stdout_callback      = yaml
gathering            = smart
fact_caching         = jsonfile
fact_caching_connection = .facts
fact_caching_timeout = 3600
interpreter_python   = auto_silent
retry_files_enabled  = False
display_skipped_hosts = False

[ssh_connection]
# Pipelining collapses each task to roughly one round trip, and ControlPersist
# reuses the SSH connection across tasks. Both matter here: every connection
# runs inside the WireGuard tunnel, and chatty protocols feel tunnel latency.
pipelining = True
ssh_args   = -o ControlMaster=auto -o ControlPersist=600s -o PreferredAuthentications=publickey
